[workspace]
resolver = "2"
members = [
    "crates/flyq-protocol",
    "crates/flyq-network",
    "crates/flyq-storage",
    "crates/flyq-ui",
    "crates/flyq-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ezy369/lanchat"

[workspace.dependencies]
# Internal crates
flyq-protocol = { path = "crates/flyq-protocol" }
flyq-network = { path = "crates/flyq-network" }
flyq-storage = { path = "crates/flyq-storage" }
flyq-ui = { path = "crates/flyq-ui" }
flyq-core = { path = "crates/flyq-core" }

# GPUI ecosystem
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Storage
libsql = "0.6"

# Networking
if-addrs = "0.13"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
notify-rust = "4"
rust-i18n = "3"
xcap = "0.5"
rodio = "0.20"

[package]
name = "lanchat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A modern, open-source LAN messenger compatible with FeiQ / IP Messenger"
# Used by cargo-wix as the MSI "Manufacturer".
authors = ["LanChat contributors"]

[[bin]]
name = "lanchat"
path = "src/main.rs"

# Embeds the app icon + version metadata into lanchat.exe via the Windows SDK
# resource compiler (rc.exe). Windows-only; the build script no-ops elsewhere.
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[dependencies]
flyq-core.workspace = true
flyq-ui.workspace = true
flyq-network.workspace = true
flyq-storage.workspace = true
flyq-protocol.workspace = true

gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rust-i18n.workspace = true

# System tray (GPUI has no first-class tray support; tray-icon drives the OS
# tray directly and is polled from a GPUI foreground task). Gated to Windows and
# macOS because the Linux backend pulls GTK/libappindicator system libraries.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24"

# cargo-bundle metadata for the macOS `.app` / `.dmg` release package
# (`cargo bundle --release` on a Mac). cargo-bundle converts the PNG icons into
# an `.icns` for the app bundle.
[package.metadata.bundle]
name = "LanChat"
identifier = "io.github.ezy369.lanchat"
icon = ["assets/icon_256.png", "assets/icon_48.png", "assets/icon_32.png", "assets/icon_16.png"]
category = "SocialNetworking"
short_description = "Open-source LAN messenger (FeiQ / IP Messenger compatible)"
long_description = "LanChat speaks the IPMsg wire protocol (UDP/TCP 2425) with FeiQ extensions: automatic peer discovery, text chat with delivery/read receipts, typing indicators, screen shake, file and folder transfer, persistent history with full-text search, presence, tray and notifications."
osx_minimum_system_version = "10.15"
